<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>我的輪班</title>

<meta name="theme-color"
content="#F2F2F7">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="default">

<meta name="apple-mobile-web-app-title"
content="我的輪班">

<link rel="manifest"
href="manifest.json">

<link rel="apple-touch-icon"
href="icon.svg">


<style>

:root{

    --background:#F2F2F7;

    --card:#FFFFFF;

    --text:#1C1C1E;

    --secondary:#8E8E93;

    --blue:#007AFF;

    --orange:#FF9500;

    --purple:#AF52DE;

    --indigo:#5856D6;

    --green:#34C759;

    --separator:
        rgba(60,60,67,.12);

}

@media(prefers-color-scheme:dark){

:root{

    --background:#000000;

    --card:#1C1C1E;

    --text:#FFFFFF;

    --secondary:#98989D;

    --separator:
        rgba(84,84,88,.65);

}

}


*{

    box-sizing:border-box;

    -webkit-tap-highlight-color:
        transparent;

}


html{

    background:
        var(--background);

}


body{

    margin:0;

    color:var(--text);

    background:
        var(--background);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "PingFang TC",
        "Helvetica Neue",
        sans-serif;

    padding-top:
        env(safe-area-inset-top);

    padding-bottom:
        calc(82px + env(safe-area-inset-bottom));

    min-height:100vh;

}


/* =========================
   APP
========================= */

.app{

    width:100%;

    max-width:720px;

    margin:auto;

}


/* =========================
   PAGE
========================= */

.page{

    display:none;

    padding:
        18px
        18px
        25px;

    animation:
        pageIn .25s ease;

}


.page.active{

    display:block;

}


@keyframes pageIn{

    from{

        opacity:0;

        transform:
            translateY(8px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* =========================
   HEADER
========================= */

.header{

    padding:
        8px
        3px
        4px;

}


.header-title{

    font-size:34px;

    font-weight:800;

    letter-spacing:-1.2px;

}


.header-subtitle{

    margin-top:3px;

    font-size:15px;

    color:
        var(--secondary);

}


/* =========================
   CARD
========================= */

.card{

    background:
        var(--card);

    border-radius:22px;

    margin-top:18px;

    overflow:hidden;

    box-shadow:
        0 1px 3px
        rgba(0,0,0,.05);

}


/* =========================
   TODAY CARD
========================= */

.today-card{

    text-align:center;

    padding:
        28px
        20px
        26px;

}


.today-label{

    font-size:15px;

    color:
        var(--secondary);

}


.today-date{

    font-size:18px;

    font-weight:700;

    margin-top:5px;

}


.today-shift{

    width:210px;

    height:130px;

    margin:
        22px auto;

    border-radius:32px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:38px;

    font-weight:800;

    letter-spacing:-1px;

}


.shift-day{

    color:
        var(--orange);

    background:
        rgba(255,149,0,.13);

}


.shift-evening{

    color:
        var(--indigo);

    background:
        rgba(88,86,214,.13);

}


.shift-night{

    color:
        var(--purple);

    background:
        rgba(175,82,222,.13);

}


.shift-rest{

    color:
        var(--green);

    background:
        rgba(52,199,89,.13);

}


.tomorrow{

    color:
        var(--secondary);

    font-size:15px;

}


.tomorrow strong{

    color:
        var(--text);

    margin-left:5px;

}


/* =========================
   SECTION TITLE
========================= */

.section-title{

    margin:
        28px
        6px
        9px;

    font-size:21px;

    font-weight:800;

    letter-spacing:-.3px;

}


/* =========================
   LIST
========================= */

.list-row{

    min-height:70px;

    display:flex;

    align-items:center;

    padding:
        0 18px;

    border-bottom:
        1px solid var(--separator);

}


.list-row:last-child{

    border-bottom:none;

}


.date-badge{

    width:45px;

    height:45px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    margin-right:14px;

    background:
        rgba(0,122,255,.1);

    color:
        var(--blue);

    font-weight:800;

}


.list-main{

    flex:1;

}


.list-date{

    color:
        var(--secondary);

    font-size:13px;

}


.list-shift{

    font-size:17px;

    font-weight:700;

    margin-top:2px;

}


/* =========================
   CALENDAR
========================= */

.calendar-top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        18px;

}


.calendar-month{

    font-size:22px;

    font-weight:800;

}


.month-controls{

    display:flex;

    gap:8px;

}


.circle-button{

    width:38px;

    height:38px;

    border:0;

    border-radius:50%;

    background:
        rgba(120,120,128,.12);

    color:
        var(--text);

    font-size:25px;

    display:flex;

    justify-content:center;

    align-items:center;

}


.weekdays{

    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    padding:
        0 8px;

}


.weekday{

    text-align:center;

    color:
        var(--secondary);

    font-size:12px;

    font-weight:600;

    padding:
        7px 0;

}


.calendar{

    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    padding:
        4px 8px 14px;

}


.calendar-cell{

    height:66px;

    padding:3px;

}


.calendar-cell-inner{

    height:60px;

    border-radius:16px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

}


.calendar-cell.today
.calendar-cell-inner{

    outline:
        2px solid
        var(--blue);

    outline-offset:-2px;

}


.calendar-cell.selected
.calendar-cell-inner{

    background:
        rgba(0,122,255,.1);

}


.calendar-number{

    font-size:15px;

    font-weight:700;

}


.calendar-shift{

    font-size:9px;

    font-weight:800;

    margin-top:5px;

}


/* =========================
   DETAIL SHEET
========================= */

.detail-card{

    padding:20px;

}


.detail-date{

    color:
        var(--secondary);

    font-size:14px;

}


.detail-shift{

    font-size:30px;

    font-weight:800;

    margin-top:5px;

}


/* =========================
   SETTINGS
========================= */

.settings-card{

    padding:
        0 18px;

}


.setting{

    padding:
        18px 0;

    border-bottom:
        1px solid var(--separator);

}


.setting:last-child{

    border-bottom:none;

}


.setting-label{

    font-weight:700;

    margin-bottom:10px;

}


input,
select{

    width:100%;

    border:0;

    outline:none;

    border-radius:13px;

    padding:13px;

    color:
        var(--text);

    background:
        rgba(120,120,128,.12);

}


.action-button{

    width:100%;

    border:0;

    border-radius:14px;

    padding:15px;

    margin-top:12px;

    background:
        var(--blue);

    color:white;

    font-weight:700;

    font-size:16px;

}


.action-button.secondary{

    background:
        rgba(120,120,128,.12);

    color:
        var(--text);

}


/* =========================
   STATISTICS
========================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;

}


.stat{

    padding:17px;

    background:
        var(--card);

    border-radius:20px;

}


.stat-label{

    color:
        var(--secondary);

    font-size:13px;

}


.stat-number{

    font-size:27px;

    font-weight:800;

    margin-top:4px;

}


/* =========================
   TAB BAR
========================= */

.tabbar{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    z-index:100;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    padding:
        7px
        18px
        calc(7px + env(safe-area-inset-bottom));

    background:
        rgba(248,248,250,.88);

    border-top:
        1px solid
        var(--separator);

    backdrop-filter:
        blur(25px)
        saturate(180%);

    -webkit-backdrop-filter:
        blur(25px)
        saturate(180%);

}


@media(prefers-color-scheme:dark){

.tabbar{

    background:
        rgba(28,28,30,.88);

}

}


.tab{

    border:0;

    background:none;

    color:
        var(--secondary);

    font-size:11px;

    font-weight:600;

    padding:3px;

}


.tab.active{

    color:
        var(--blue);

}


.tab-icon{

    font-size:22px;

    display:block;

    line-height:24px;

    margin-bottom:2px;

}


/* =========================
   TOAST
========================= */

.toast{

    position:fixed;

    left:50%;

    bottom:
        calc(95px + env(safe-area-inset-bottom));

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    background:
        rgba(30,30,30,.9);

    color:white;

    padding:
        12px 20px;

    border-radius:15px;

    font-size:14px;

    transition:
        .25s;

    z-index:300;

}


.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);

}


/* =========================
   APP VERSION
========================= */

.version{

    text-align:center;

    color:
        var(--secondary);

    font-size:12px;

    padding:
        30px 0 15px;

}

</style>

</head>


<body>

<script>


/* =================================
   DEFAULT SETTINGS
================================= */

const DEFAULT = {

    baseDate:
        "2026-08-12",

    baseShift:3,

    shifts:[

        "白天1",
        "白天2",
        "小夜1",
        "小夜2",
        "休息",
        "大夜1",
        "大夜2",
        "休息"

    ]

};


/* =================================
   LOAD SETTINGS
================================= */

function loadConfig(){

    try{

        const saved =
            localStorage.getItem(
                "shift-app-settings"
            );

        if(saved){

            return {

                ...DEFAULT,

                ...JSON.parse(saved)

            };

        }

    }catch(e){}

    return {

        ...DEFAULT,

        shifts:[
            ...DEFAULT.shifts
        ]

    };

}


let config =
    loadConfig();


let calendarDate =
    new Date();


let selectedDate =
    new Date();



/* =================================
   DATE
================================= */

function dateOnly(date){

    return new Date(

        date.getFullYear(),
        date.getMonth(),
        date.getDate()

    );

}


function diffDays(a,b){

    return Math.round(

        (
            dateOnly(a)
            -
            dateOnly(b)
        )
        /
        86400000

    );

}


function sameDate(a,b){

    return (

        a.getFullYear()
        ===
        b.getFullYear()

        &&

        a.getMonth()
        ===
        b.getMonth()

        &&

        a.getDate()
        ===
        b.getDate()

    );

}


function formatDate(date){

    return (

        date.getFullYear()
        +"/"+
        String(
            date.getMonth()+1
        ).padStart(2,"0")
        +"/"+
        String(
            date.getDate()
        ).padStart(2,"0")

    );

}


function chineseDate(date){

    const week=[

        "星期日",
        "星期一",
        "星期二",
        "星期三",
        "星期四",
        "星期五",
        "星期六"

    ];

    return (

        date.getFullYear()
        +"年"+
        (date.getMonth()+1)
        +"月"+
        date.getDate()
        +"日 · "+
        week[date.getDay()]

    );

}


/* =================================
   SHIFT CALCULATION
================================= */

function getShift(date){

    const base =
        new Date(
            config.baseDate
            +"T00:00:00"
        );


    let index =

        (

            config.baseShift
            +
            diffDays(
                date,
                base
            )

        )
        %
        config.shifts.length;


    if(index<0){

        index +=
            config.shifts.length;

    }


    return config.shifts[index];

}


/* =================================
   SHIFT STYLE
================================= */

function shiftClass(shift){

    if(
        shift.startsWith("白天")
    ){

        return "shift-day";

    }


    if(
        shift.startsWith("小夜")
    ){

        return "shift-evening";

    }


    if(
        shift.startsWith("大夜")
    ){

        return "shift-night";

    }


    return "shift-rest";

}


function shiftColor(shift){

    if(
        shift.startsWith("白天")
    ){

        return "var(--orange)";

    }


    if(
        shift.startsWith("小夜")
    ){

        return "var(--indigo)";

    }


    if(
        shift.startsWith("大夜")
    ){

        return "var(--purple)";

    }


    return "var(--green)";

}



/* =================================
   HOME
================================= */

function renderHome(){

    const today =
        new Date();


    const tomorrow =
        new Date(today);


    tomorrow.setDate(
        tomorrow.getDate()+1
    );


    const shift =
        getShift(today);


    document.getElementById(
        "todayDate"
    ).textContent =
        chineseDate(today);


    const badge =
        document.getElementById(
            "todayShift"
        );


    badge.textContent =
        shift;


    badge.className =
        "today-shift "
        +
        shiftClass(shift);


    document.getElementById(
        "tomorrowShift"
    ).textContent =
        getShift(tomorrow);


    const container =
        document.getElementById(
            "upcoming"
        );


    container.innerHTML="";


    for(
        let i=1;
        i<=7;
        i++
    ){

        const date =
            new Date(today);


        date.setDate(
            date.getDate()+i
        );


        const shift =
            getShift(date);


        const row =
            document.createElement(
                "div"
            );


        row.className =
            "list-row";


        row.innerHTML = `

            <div class="date-badge">

                ${date.getDate()}

            </div>


            <div class="list-main">

                <div class="list-date">

                    ${formatDate(date)}

                </div>


                <div
                    class="list-shift"
                    style="
                    color:${shiftColor(shift)}
                    ">

                    ${shift}

                </div>

            </div>

        `;


        container.appendChild(row);

    }

}



/* =================================
   CALENDAR
================================= */

function renderCalendar(){

    const year =
        calendarDate.getFullYear();


    const month =
        calendarDate.getMonth();


    document.getElementById(
        "monthTitle"
    ).textContent =
        `${year}年${month+1}月`;


    const grid =
        document.getElementById(
            "calendarGrid"
        );


    grid.innerHTML="";


    const first =
        new Date(
            year,
            month,
            1
        );


    const total =
        new Date(
            year,
            month+1,
            0
        ).getDate();


    for(
        let i=0;
        i<first.getDay();
        i++
    ){

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "calendar-cell";


        grid.appendChild(
            empty
        );

    }


    for(
        let day=1;
        day<=total;
        day++
    ){

        const date =
            new Date(
                year,
                month,
                day
            );


        const shift =
            getShift(date);


        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "calendar-cell";


        if(
            sameDate(
                date,
                new Date()
            )
        ){

            cell.classList.add(
                "today"
            );

        }


        if(
            sameDate(
                date,
                selectedDate
            )
        ){

            cell.classList.add(
                "selected"
            );

        }


        cell.innerHTML = `

            <div
                class="calendar-cell-inner">

                <div
                    class="calendar-number">

                    ${day}

                </div>


                <div
                    class="calendar-shift"
                    style="
                    color:${shiftColor(shift)}
                    ">

                    ${shift}

                </div>

            </div>

        `;


        cell.onclick=()=>{

            selectedDate =
                new Date(date);


            renderCalendar();

            renderDetail();

        };


        grid.appendChild(cell);

    }


    renderStats();

}



/* =================================
   DETAIL
================================= */

function renderDetail(){

    const shift =
        getShift(
            selectedDate
        );


    document.getElementById(
        "detail"
    ).innerHTML = `

        <div class="detail-date">

            ${chineseDate(selectedDate)}

        </div>


        <div
            class="detail-shift"
            style="
            color:${shiftColor(shift)}
            ">

            ${shift}

        </div>

    `;

}



/* =================================
   STATISTICS
================================= */

function renderStats(){

    const year =
        calendarDate.getFullYear();


    const month =
        calendarDate.getMonth();


    const total =
        new Date(
            year,
            month+1,
            0
        ).getDate();


    let day=0;

    let evening=0;

    let night=0;

    let rest=0;


    for(
        let i=1;
        i<=total;
        i++
    ){

        const shift =
            getShift(
                new Date(
                    year,
                    month,
                    i
                )
            );


        if(
            shift.startsWith("白天")
        ){

            day++;

        }

        else if(
            shift.startsWith("小夜")
        ){

            evening++;

        }

        else if(
            shift.startsWith("大夜")
        ){

            night++;

        }

        else{

            rest++;

        }

    }


    document.getElementById(
        "dayCount"
    ).textContent=day;


    document.getElementById(
        "eveningCount"
    ).textContent=evening;


    document.getElementById(
        "nightCount"
    ).textContent=night;


    document.getElementById(
        "restCount"
    ).textContent=rest;

}



/* =================================
   SETTINGS
================================= */

function renderSettings(){

    document.getElementById(
        "baseDate"
    ).value =
        config.baseDate;


    document.getElementById(
        "baseShift"
    ).value =
        config.baseShift;

}



document.getElementById(
    "saveSettings"
).onclick=()=>{

    config.baseDate =
        document.getElementById(
            "baseDate"
        ).value;


    config.baseShift =
        Number(
            document.getElementById(
                "baseShift"
            ).value
        );


    localStorage.setItem(

        "shift-app-settings",

        JSON.stringify(config)

    );


    renderHome();

    renderCalendar();

    renderDetail();


    showToast(
        "已儲存輪班設定"
    );

};



document.getElementById(
    "resetSettings"
).onclick=()=>{

    if(
        !confirm(
            "確定恢復預設輪班？"
        )
    ){

        return;

    }


    config={

        ...DEFAULT,

        shifts:[
            ...DEFAULT.shifts
        ]

    };


    localStorage.setItem(

        "shift-app-settings",

        JSON.stringify(config)

    );


    renderSettings();

    renderHome();

    renderCalendar();

    renderDetail();


    showToast(
        "已恢復預設"
    );

};



/* =================================
   MONTH
================================= */

document.getElementById(
    "prevMonth"
).onclick=()=>{

    calendarDate =
        new Date(

            calendarDate.getFullYear(),

            calendarDate.getMonth()-1,

            1

        );


    renderCalendar();

};



document.getElementById(
    "nextMonth"
).onclick=()=>{

    calendarDate =
        new Date(

            calendarDate.getFullYear(),

            calendarDate.getMonth()+1,

            1

        );


    renderCalendar();

};



document.getElementById(
    "todayButton"
).onclick=()=>{

    const today =
        new Date();


    calendarDate =
        new Date(

            today.getFullYear(),

            today.getMonth(),

            1

        );


    selectedDate =
        new Date(today);


    renderCalendar();

    renderDetail();

};



/* =================================
   TAB BAR
================================= */

document
.querySelectorAll(".tab")
.forEach(tab=>{

    tab.onclick=()=>{

        document
        .querySelectorAll(".page")
        .forEach(
            page =>
                page.classList.remove(
                    "active"
                )
        );


        document
        .getElementById(
            tab.dataset.page
        )
        .classList.add(
            "active"
        );


        document
        .querySelectorAll(".tab")
        .forEach(
            t =>
                t.classList.remove(
                    "active"
                )
        );


        tab.classList.add(
            "active"
        );


        if(
            tab.dataset.page
            ===
            "calendarPage"
        ){

            renderCalendar();

            renderDetail();

        }


        if(
            tab.dataset.page
            ===
            "settingsPage"
        ){

            renderSettings();

        }

    };

});



/* =================================
   TOAST
================================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(()=>{

        toast.classList.remove(
            "show"
        );

    },1800);

}



/* =================================
   SERVICE WORKER
================================= */

if(
    "serviceWorker"
    in navigator
){

    window.addEventListener(
        "load",
        ()=>{

            navigator
            .serviceWorker
            .register(
                "service-worker.js"
            )
            .catch(
                console.error
            );

        }
    );

}



/* =================================
   START
================================= */

renderHome();

renderCalendar();

renderDetail();

renderSettings();

</script>

</body>
</html>
